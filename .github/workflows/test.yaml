name: Test
on:
    workflow_dispatch:
    pull_request:

# a new push to a pull request cancels the run of the previous one
concurrency:
    group: test-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    test:
        name: Test
        runs-on: ubuntu-22.04
        steps:
            ###################################################
            #
            # Prepare
            #
            ###################################################

            - name: (PREPARE) Checkout Repository
              uses: actions/checkout@v4

            - name: (PREPARE) Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc
                  cache: yarn

            - name: (PREPARE) Install Dependencies
              run: yarn --frozen-lockfile

            ###################################################
            #
            # Test
            #
            ###################################################

            - name: (TEST) Check ESLint
              run: yarn lint:check

            - name: (TEST) Check Prettier
              run: yarn style:check

            - name: (TEST) Check Types
              run: yarn types:check

            - name: (TEST) Run Tests
              run: yarn test

            - name: (TEST) Check Dependencies
              run: yarn license:check

            ###################################################
            #
            # Distribution
            #
            ###################################################

            - name: (DIST) Build Project
              run: yarn dist:build

            - name: (DIST) Test Bundle
              run: yarn test:cli
              env:
                  STOETZMS_WORK_CLI: dist/stoetzms-work.js

            - name: (DOCS) Build Docs
              run: yarn docs:build
